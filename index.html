<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#131210">
<meta name="description" content="Private AI chat and roleplay with voices.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stage">
<title>Stage</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>

<!-- Talk mode: hands-free voice conversation -->
<div id="talk" class="talk" hidden>
  <button class="icon-btn talk-close" id="talkClose" aria-label="End call">✕</button>
  <div class="talk-avatar" id="talkAvatar"></div>
  <div class="talk-name" id="talkName"></div>
  <div class="talk-status" id="talkStatus">Starting…</div>
  <div class="talk-text" id="talkText" dir="auto"></div>
  <div class="talk-controls">
    <button class="btn" id="talkMute">Pause mic</button>
    <button class="btn danger" id="talkEnd">End</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/db.js"></script>
<script src="js/local.js"></script>
<script src="js/ai.js"></script>
<script src="js/voice.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
